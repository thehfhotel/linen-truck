# LOCAL ONLY — a smoke test of the image on a laptop. This file never reaches a
# box: production is docker-compose.hfville.yml, shipped by CI inside the deploy
# tarball (docs/CONTRACTS.md §11).
#
# Day-to-day development does not need docker at all:
#   bun install && bun run dev     # http://localhost:4100
services:
  truck:
    build:
      context: .
      args:
        GIT_SHA: local
    image: truck:local
    container_name: truck-local
    restart: "no"
    ports:
      - "127.0.0.1:4100:4100"
    environment:
      # NOT production, and therefore NOT /data: src/server/config.ts throws at
      # boot if the real production volume path is opened outside production.
      - NODE_ENV=development
      - TZ=Asia/Bangkok
      - PORT=4100
      - DATA_DIR=/app/data
      - PUBLIC_URL=http://localhost:4100
      - GIT_SHA=local
      # ─────────────────────────────────────────────────────────────────────
      # ALLOW_DEV_AUTH REPLACES THE CLOUDFLARE ACCESS JWT WITH THE PLAIN
      # X-Dev-Email HEADER. It is allowed in THIS FILE AND NOWHERE ELSE.
      # It must never appear in docker-compose.hfville.yml, in a deploy
      # payload, or in any .env that reaches a box. CI fails the deploy if it
      # shows up in the rendered payload and the box shim refuses it too.
      # ─────────────────────────────────────────────────────────────────────
      - ALLOW_DEV_AUTH=1
      # Left empty on purpose: with no audience the gated routes answer 503,
      # which is exactly what production does before its secret is set.
      - CF_ACCESS_AUD=
      - FEED_TOKEN=${FEED_TOKEN:-}
      - SINOTRACK_SERVER=${SINOTRACK_SERVER:-https://242.sinotrack.com}
      # Empty locally: the poller stays dormant and the pages read whatever
      # `bun scripts/import.ts` seeded.
      - SINOTRACK_USER=${SINOTRACK_USER:-}
      - SINOTRACK_PASSWORD=${SINOTRACK_PASSWORD:-}
      - SINOTRACK_TEID=${SINOTRACK_TEID:-}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-600}
      - POLL_WINDOW_HOURS=${POLL_WINDOW_HOURS:-48}
      # Off locally — no nightly VACUUM on a laptop.
      - BACKUP_TIME=
      - TRUSTED_PROXY_CIDRS=127.0.0.1/32,172.16.0.0/12
    volumes:
      - truck_local_data:/app/data

volumes:
  truck_local_data:
